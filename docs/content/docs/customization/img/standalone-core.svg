<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1300" height="740" fill="#ffffff"/>
  <rect x="980" y="8" width="300" height="290" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1140" y="34" text-anchor="middle" font-size="15" fill="#7c3aed" letter-spacing="1">AGENTS</text>
  <rect x="20" y="40" width="880" height="240" rx="12" fill="#1e293b"/>
  <text x="460" y="82" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">AgentCore</text>
  <text x="460" y="107" text-anchor="middle" font-size="14" fill="#cbd5e1">the generic engine behind every agent</text>
  <line x1="60" y1="127" x2="860" y2="127" stroke="#475569" stroke-width="1"/>
  <g font-size="16" fill="#fff">
    <text x="80" y="170">• Chat with agents</text>
    <text x="80" y="206">• Automated background tasks</text>
    <text x="80" y="242">• Choice of AI models</text>
    <text x="500" y="170">• Users, roles &amp; permissions</text>
    <text x="500" y="206">• Storage &amp; configuration</text>
    <text x="500" y="242">• Management UI</text>
  </g>
  <line x1="160" y1="280" x2="160" y2="338" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="280" x2="460" y2="338" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="280" x2="760" y2="338" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="20" y="340" width="280" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="160" y="374" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">Data</text>
  <rect x="40" y="392" width="240" height="150" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="160" y="461" text-anchor="middle" font-size="17" fill="#64748b" font-style="italic">Nothing here</text>
  <text x="160" y="483" text-anchor="middle" font-size="17" fill="#64748b" font-style="italic">without a vertical</text>
  <line x1="45" y1="608" x2="275" y2="608" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="634" text-anchor="middle" font-size="15" font-style="italic" fill="#64748b">Defined by a vertical; without</text>
  <text x="160" y="656" text-anchor="middle" font-size="15" font-style="italic" fill="#64748b">one, there is no domain data</text>
  <text x="160" y="678" text-anchor="middle" font-size="15" font-style="italic" fill="#64748b">to expose to agents</text>
  <rect x="320" y="340" width="280" height="360" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="460" y="374" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">Integration types</text>
  <rect x="340" y="392" width="240" height="64" rx="8" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="460" y="418" text-anchor="middle" font-size="17" fill="#0f172a">MCP server</text>
  <text x="460" y="440" text-anchor="middle" font-size="13" fill="#0f172a">ready to use</text>
  <rect x="340" y="464" width="240" height="76" rx="8" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="460" y="496" text-anchor="middle" font-size="17" fill="#0f172a">Generic integration</text>
  <text x="460" y="518" text-anchor="middle" font-size="17" fill="#0f172a">(external access)</text>
  <line x1="345" y1="608" x2="575" y2="608" stroke="#fdba74" stroke-width="1"/>
  <text x="460" y="634" text-anchor="middle" font-size="15" font-style="italic" fill="#9a3412">Generic integration is a base</text>
  <text x="460" y="656" text-anchor="middle" font-size="15" font-style="italic" fill="#9a3412">type: concrete integrations</text>
  <text x="460" y="678" text-anchor="middle" font-size="15" font-style="italic" fill="#9a3412">need to be implemented</text>
  <rect x="620" y="340" width="280" height="360" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="374" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">Default agent builder</text>
  <rect x="640" y="392" width="240" height="44" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="419" text-anchor="middle" font-size="17" fill="#0f172a">Chat history</text>
  <rect x="640" y="446" width="240" height="44" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="473" text-anchor="middle" font-size="17" fill="#0f172a">Conversation memory</text>
  <rect x="640" y="500" width="240" height="44" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="527" text-anchor="middle" font-size="17" fill="#0f172a">Tool scratchpad</text>
  <rect x="640" y="554" width="240" height="44" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="581" text-anchor="middle" font-size="17" fill="#0f172a">Platform repositories</text>
  <line x1="645" y1="608" x2="875" y2="608" stroke="#7dd3fc" stroke-width="1"/>
  <text x="760" y="634" text-anchor="middle" font-size="15" font-style="italic" fill="#075985">Exposes only generic internals,</text>
  <text x="760" y="656" text-anchor="middle" font-size="15" font-style="italic" fill="#075985">no domain data and no</text>
  <text x="760" y="678" text-anchor="middle" font-size="15" font-style="italic" fill="#075985">domain integrations</text>
  <line x1="900" y1="85" x2="1018" y2="85" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="160" x2="1018" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="235" x2="1018" y2="235" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1020" y="53" width="240" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1140" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">General Assistant</text>
  <rect x="1020" y="128" width="240" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1140" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Research Agent</text>
  <rect x="1020" y="203" width="240" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1140" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Report Generator</text>
</svg>
