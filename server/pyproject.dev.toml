[project]
name = "suvereo"

requires-python = ">=3.10, <4.0"
dependencies = [
    "celery (==5.5.3)",
    "channels (==4.2.2)",
    "channels-redis (==4.2.1)",
    "daphne (==4.2.1)",
    "django (>=5.2.12,<6.0.0)",
    "django-cors-headers (==4.7.0)",
    "django-environ (==0.12.0)",
    "djangorestframework (==3.16.0)",
    "drf-yasg (==1.21.10)",
    "suvereo-common (==1.0.0)",
    "suvereo-model-openai (==1.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
    "langchain-text-splitters (>=0.3.0,<1.0.0)",
    "pgvector (==0.4.1)",
    "psycopg2 (==2.9.10)",
    "pytest-django (==4.11.1)",
    "redis (==6.2.0)",
    "uvicorn (>=0.35,<1.0.0)",
    "whitenoise (==6.9.0)",
    "model-bakery (>=1.20.5,<2.0.0)",
    "django-filter (>=25.1,<26.0)",
    "pypdf (>=6.0.0, <7.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "sqlglot (>=28.5.0,<29.0.0)",
    "djangorestframework-simplejwt (==5.5.1)",
]


[tool.poetry.group.dev.dependencies]
suvereo-common = { path = "../plugins/suvereo-common", develop = true }
suvereo-model-openai = { path = "../plugins/suvereo-model-openai", develop = true }

[tool.poetry]
package-mode = false