repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.3
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format

- repo: local
  hooks:
    - id: frontend-lint
      name: Frontend Lint
      entry: bash -c "cd frontend && pnpm run lint:fix"
      language: system
      files: ^frontend/.*\.(js|ts|tsx)$
      pass_filenames: false

    - id: code-conventions
      name: Code conventions
      entry: python scripts/lint/check_conventions.py
      language: python
      additional_dependencies: ["ruff==0.15.9"]
      files: ^(server|plugins|scripts/lint)/.*\.(py|toml|json)$
      pass_filenames: false
