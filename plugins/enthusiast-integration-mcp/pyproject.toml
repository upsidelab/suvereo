[tool.poetry]
name = "enthusiast-integration-mcp"
version = "1.0.0"
description = "MCP (Model Context Protocol) server integration for Enthusiast — connect one or more MCP servers per dataset."
authors = ["Rafal Cymerys <rafal@upsidelab.io>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
enthusiast-common = ">=1.7.0"
langchain-mcp-adapters = ">=0.3.2,<0.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
