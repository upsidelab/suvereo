[tool.poetry]
name = "suvereo-model-ollama"
version = "1.0.0"
description = "A plugin for Suvereo that provides an Ollama connector."
authors = ["Rafal Cymerys <rafal@upsidelab.io>"]
readme = "README.md"

[tool.poetry.dependencies]
