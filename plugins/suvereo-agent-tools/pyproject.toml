[project]
name = "suvereo-agent-tools"
version = "1.0.0"
description = "Shared tools for Suvereo agents"
authors = [
    {name = "Mateusz Porebski", email = "mateusz.porebski@upsidelab.io"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "suvereo-common (>=1.0.0,<2.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
]

[project.urls]
Homepage = "https://upsidelab.io/suvereo"
Repository = "https://github.com/upsidelab/suvereo.git"
Issues = "https://github.com/upsidelab/suvereo/issues"

[tool.poetry]
packages = [{include = "suvereo_agent_tools", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
