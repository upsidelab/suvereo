[project]
name = "suvereo-agent-tool-calling"
version = "1.2.0"
description = "Base implementation of a Tool Calling agent for Suvereo"
authors = [
    {name = "Damian Sowiński",email = "damian.sowinski@upsidelab.io"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "suvereo-agent-tools (>=1.0.0,<2.0.0)",
    "suvereo-common (>=1.7.0,<2.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "suvereo_agent_tool_calling", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
