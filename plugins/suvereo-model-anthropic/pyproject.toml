[tool.poetry]
name = "suvereo-model-anthropic"
version = "1.0.0"
description = "A plugin for Suvereo that provides an Anthropic connector."
authors = ["Mateusz Porębski <mateusz.porebski@upsidelab.io>"]
readme = "README.md"

[tool.poetry.dependencies]
langchain-core = "^1.2"
python = "^3.10"
suvereo-common = ">=1.7.0,<2"
anthropic = ">=0.80,<1.0"
langchain-anthropic = "^1.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"